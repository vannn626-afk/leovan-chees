name: Build LEOVAN CHEESY APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    name: Build Signed Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure JDK 21 & Android SDK Licenses
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          for sm in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/cmdline-tools/"*/bin/sdkmanager; do
            if [ -x "$sm" ]; then
              yes | "$sm" --licenses >/dev/null 2>&1 || true
              break
            fi
          done

      - name: Prepare .env, debug.keystore & google-services.json
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          if [ ! -f app/google-services.json ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "479482459824",
              "project_id": "gen-lang-client-0963056328",
              "storage_bucket": "gen-lang-client-0963056328.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:479482459824:android:309748bc6fdfd9825e6d75",
                  "android_client_info": {
                    "package_name": "com.aistudio.leovancheesy.vqnrzp"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "479482459824-k0fr481ummfjurcqjq5mdjjkmonofo5r.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyBIGtNdZl_TYauFgdPGZlstpqgR9s8D-SU"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "479482459824-k0fr481ummfjurcqjq5mdjjkmonofo5r.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Install Gradle 9.3.1 & Build APK
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-9.3.1/bin/gradle :app:assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/LEOVAN-CHEESY.apk
          ls -lh app/build/outputs/apk/debug/LEOVAN-CHEESY.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEOVAN-CHEESY-APK
          path: app/build/outputs/apk/debug/LEOVAN-CHEESY.apk
          if-no-files-found: error
